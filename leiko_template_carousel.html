<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* LEIKO CAROUSEL FAMILY — LOCKED (2026-08-17).
   Three slide layouts, one family (TEMPLATE-DESIGN-BRIEFS prompt 1):
     cover — opens the curiosity gap; element bleeds off the right edge
     body  — exactly one idea; readable at thumbnail size
     close — the save; send-to-someone prompt; the citation as a feature (D-C4)
   Card palette per D-C3: navy #0A1E3C · coral #FF6B5B · cream #F6F1E7.
   Type: Instrument Serif headlines · Space Grotesk body · Archivo marks.
   Only the {{TOKENS}} change per render — the layout never does.
   Rendered per-slide by render_bridge.py at 1080x1350, scale 2. */
@font-face { font-family:'Archivo'; src:url('fonts/Archivo.ttf'); font-weight:100 900; }
@font-face { font-family:'Space Grotesk'; src:url('fonts/SpaceGrotesk.ttf'); font-weight:300 700; }
@font-face { font-family:'Instrument Serif'; src:url('fonts/InstrumentSerif-Regular.ttf'); font-weight:400; font-style:normal; }
@font-face { font-family:'Instrument Serif'; src:url('fonts/InstrumentSerif-Italic.ttf'); font-weight:400; font-style:italic; }
body { margin:0; background:#111; }
.slide { width:1080px; height:1350px; position:relative; overflow:hidden; isolation:isolate; }
.topbar { position:absolute; top:0; left:0; right:0; height:150px; display:flex; align-items:center; justify-content:space-between; padding:0 72px; box-sizing:border-box; }
.wordmark { font-family:'Archivo',sans-serif; font-weight:900; font-size:26px; letter-spacing:.34em; }
.counter { font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px; letter-spacing:.14em; }
</style></head><body>

<!-- ── COVER: the slide that decides whether anyone swipes ─────────────── -->
<div class="slide" data-screen-label="cover" style="background:#0A1E3C;">
  <div class="topbar">
    <span class="wordmark" style="color:#F6F1E7;">LEIKO</span>
    <span class="counter" style="color:#F6F1E7; opacity:.55;">{{COVER_COUNT}}</span>
  </div>
  <div style="position:absolute; top:270px; left:72px; right:96px;">
    <div id="coverhead" style="font-family:'Instrument Serif',serif; font-size:128px; line-height:1.02; letter-spacing:-.01em; color:#F6F1E7; text-wrap:pretty;">{{COVER_HEAD}}</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:38px; line-height:1.3; color:#FF6B5B; margin-top:44px; max-width:760px;">{{COVER_SUB}}</div>
  </div>
  <!-- the cue that more follows: a coral band bleeding off the right edge -->
  <div style="position:absolute; right:0; bottom:210px; width:420px; height:12px; background:#FF6B5B;"></div>
  <div style="position:absolute; left:72px; bottom:64px; right:72px; display:flex; align-items:center; justify-content:space-between;">
    <span style="font-family:'Space Grotesk',sans-serif; font-size:23px; color:#F6F1E7; opacity:.6;">leiko.health</span>
    <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; letter-spacing:.18em; color:#F6F1E7;">SWIPE&nbsp;&nbsp;&#8594;</span>
  </div>
  <script>
    (function () {
      var h = document.getElementById("coverhead"); var s = 128;
      while (s > 72 && h.getBoundingClientRect().height > 620) { s -= 4; h.style.fontSize = s + "px"; }
    })();
  </script>
</div>

<!-- ── BODY: exactly one idea, readable at arm's length ────────────────── -->
<div class="slide" data-screen-label="body" style="background:#F6F1E7; background-image:radial-gradient(ellipse 120% 90% at 20% 0%, #FBF7EF 0%, #F6F1E7 55%, #EFE8DA 100%);">
  <div class="topbar">
    <span class="wordmark" style="color:#0A1E3C;">LEIKO</span>
    <span class="counter" style="color:#0A1E3C; opacity:.5;">{{BODY_COUNT}}</span>
  </div>
  <div style="position:absolute; top:230px; left:72px; right:96px;">
    <div style="font-family:'Archivo',sans-serif; font-weight:900; font-size:150px; line-height:1; letter-spacing:-.04em; color:#FF6B5B;">{{BODY_NUM}}</div>
    <div style="width:210px; height:12px; background:#FF6B5B; margin:46px 0 52px 4px;"></div>
    <div id="bodyhead" style="font-family:'Instrument Serif',serif; font-size:88px; line-height:1.06; color:#0A1E3C; text-wrap:pretty;">{{BODY_HEAD}}</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:400; font-size:42px; line-height:1.38; color:#0A1E3C; opacity:.78; margin-top:44px; max-width:820px; text-wrap:pretty;">{{BODY_TEXT}}</div>
  </div>
  <div style="position:absolute; left:72px; bottom:64px; right:72px; display:flex; align-items:center; justify-content:space-between;">
    <span style="font-family:'Space Grotesk',sans-serif; font-size:23px; color:#0A1E3C; opacity:.6;">leiko.health</span>
    <span style="font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:22px; letter-spacing:.14em; color:#0A1E3C; opacity:.45;">&#8594;</span>
  </div>
  <script>
    (function () {
      var h = document.getElementById("bodyhead"); var s = 88;
      while (s > 56 && h.getBoundingClientRect().height > 300) { s -= 4; h.style.fontSize = s + "px"; }
    })();
  </script>
</div>

<!-- ── CLOSING: the save. Send it to someone; the citation is a feature. ─ -->
<div class="slide" data-screen-label="close" style="background:#0A1E3C;">
  <div class="topbar">
    <span class="wordmark" style="color:#F6F1E7;">LEIKO</span>
    <span class="counter" style="color:#F6F1E7; opacity:.55;">{{CLOSE_COUNT}}</span>
  </div>
  <div style="position:absolute; top:250px; left:72px; right:96px;">
    <div style="font-family:'Archivo',sans-serif; font-weight:900; font-size:22px; letter-spacing:.3em; color:#FF6B5B;">WORTH KEEPING</div>
    <div id="closehead" style="font-family:'Instrument Serif',serif; font-size:96px; line-height:1.06; color:#F6F1E7; margin-top:48px; text-wrap:pretty;">{{CLOSE_HEAD}}</div>
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:400; font-size:38px; line-height:1.4; color:#F6F1E7; opacity:.75; margin-top:44px; max-width:800px;">{{CLOSE_SUB}}</div>
  </div>
  <div style="position:absolute; left:72px; bottom:190px; right:72px;">
    <div style="width:100%; height:1px; background:#F6F1E7; opacity:.25;"></div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:24px; line-height:1.45; color:#F6F1E7; opacity:.6; margin-top:26px;">{{CLOSE_SRC}}</div>
  </div>
  <div style="position:absolute; left:72px; bottom:64px; right:72px; display:flex; align-items:center; gap:18px;">
    <span style="font-family:'Archivo',sans-serif; font-weight:900; font-size:26px; letter-spacing:.34em; color:#F6F1E7;">LEIKO</span>
    <span style="width:52px; height:2px; background:#FF6B5B;"></span>
    <span style="font-family:'Space Grotesk',sans-serif; font-size:23px; color:#F6F1E7; opacity:.6;">leiko.health</span>
  </div>
  <script>
    (function () {
      var h = document.getElementById("closehead"); var s = 96;
      while (s > 56 && h.getBoundingClientRect().height > 430) { s -= 4; h.style.fontSize = s + "px"; }
    })();
  </script>
</div>

</body></html>
